# EasyPanel: App type Compose, this file, context = repo root.
# Site on port 80 + Discord whitelist bot (no HTTP port).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://dppyamtmjzmmkzjlmiew.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_DISCORD_INVITE_URL: ${VITE_DISCORD_INVITE_URL}
        VITE_INSTAGRAM_URL: ${VITE_INSTAGRAM_URL:-}
        VITE_TIKTOK_URL: ${VITE_TIKTOK_URL:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
    ports:
      - "80:80"
    restart: unless-stopped

  discord-bot:
    build:
      context: .
      dockerfile: discord-bot/Dockerfile
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      SUPABASE_URL: ${SUPABASE_URL:-https://dppyamtmjzmmkzjlmiew.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DISCORD_WL_FORM_CHANNEL_ID: ${DISCORD_WL_FORM_CHANNEL_ID:-}
      DISCORD_WL_THREAD_CHANNEL_ID: ${DISCORD_WL_THREAD_CHANNEL_ID:-}
    restart: unless-stopped
